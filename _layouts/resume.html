<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} — {{ site.title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #ffffff;
            color: #000000;
            font-family: 'Inter', 'Helvetica Neue', sans-serif;
        }
        .resume {
            max-width: 680px;
            margin: 0 auto;
            padding: 64px 24px;
        }
        .masthead,
        .dates {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }
        .masthead {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 0 0.6em;
        }
        .masthead h1 { font: inherit; }
        .masthead a {
            color: inherit;
            text-decoration: none;
            padding-bottom: 2px;
            border-bottom: 2px solid transparent;
            transition: border-color 0.2s ease;
        }
        .masthead a:hover { border-bottom-color: #000000; }
        .experience {
            list-style: none;
            margin-top: 48px;
        }
        .job {
            display: grid;
            grid-template-columns: 48px minmax(0, 1fr);
            gap: 16px;
            padding: 32px 0;
        }
        .job:first-child { padding-top: 0; }
        .job + .job { border-top: 1px solid rgba(0, 0, 0, 0.1); }
        .logo {
            display: block;
            width: 48px;
            height: 48px;
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.08);
        }
        .logo-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f2f2f2;
            color: #9a9a9a;
        }
        .job h2 {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.3;
        }
        .dates {
            margin-top: 6px;
            color: #6b6b6b;
        }
        .description {
            margin-top: 12px;
            font-size: 15px;
            line-height: 1.6;
            color: #222222;
        }
        .description > * + * { margin-top: 0.75em; }
        .description ul {
            list-style: disc;
            padding-left: 1.2em;
        }
        .description li + li { margin-top: 0.35em; }

        /* ── Mobile ──────────────────────────────────────────────── */
        @media (max-width: 768px) {
            .resume { padding: 32px 16px; }
        }
    </style>
</head>
<body>
    <main class="resume">
        <header class="masthead">
            <a href="{{ "/" | relative_url }}">{{ site.title }}</a>
            <span aria-hidden="true">·</span>
            <h1>{{ page.title }}</h1>
        </header>
        {{ content }}
    </main>
</body>
</html>
