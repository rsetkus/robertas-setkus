    text: "AGENTS.md's \"How the site fits together\" section (the text between that
      heading and the next ## heading) has a bullet starting with **Analytics** that
      mentions _config.yml and analytics.counter_dev, says the script loads only in
      production, and says a new layout must include analytics.html in its <head>."
  - id: AC18
    text: "The production build still contains no AGENTS.md or AGENTS.html (the edit
      does not publish the file)."
