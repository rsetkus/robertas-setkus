dependencies: [STORY-1]
description: |
  Adds a short "Analytics" item to "How the site fits together" in AGENTS.md, so future agents
  know where the settings live and that a new layout must include the analytics include.
  AGENTS.md is excluded from the build, so these criteria check the file itself.
acceptance_criteria:
